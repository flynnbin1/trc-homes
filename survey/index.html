  <title>Your free renovation consultation — TRC Homes, Cork</title>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NLLFX367" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="app">
    <header class="app-header">
      <div class="app-header__bar">
        <button class="back-btn" id="backBtn" type="button" hidden aria-label="Go back to the previous question">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Back</span>
        </button>
        <a class="app-header__brand" href="/" aria-label="TRC Homes — home">
          <svg class="brand-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
            <path d="M 10 62 L 48 24 L 86 62" stroke="#1E3A2F" stroke-width="7" fill="none"/>
            <path d="M 10 81 L 86 81" stroke="#1E3A2F" stroke-width="7" fill="none"/>
            <rect x="43.5" y="62.5" width="9" height="9" fill="#B08D57"/>
          </svg>
          <span class="brand-word">TRC&nbsp;Homes</span>
        </a>
        <span class="app-header__locale">Cork&nbsp;&middot;&nbsp;Ireland</span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Survey progress">
        <div class="progress__fill" id="progressFill"></div>
      </div>
      <span class="progress__label" id="progressLabel">Step 1</span>
    </header>

    <main class="stage" id="stage" aria-live="polite">
      <!-- Steps are rendered here by js/quiz.js -->
    </main>
  </div>

  <!-- Shared cookie-consent from the main site root (same origin on trchomes.ie).
       Its .cc-* styles are ported into survey.css so the banner renders on-brand. -->
  <script src="/js/cookie-consent.js" defer></script>
  <script src="js/quiz.js" defer></script>
